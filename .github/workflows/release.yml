name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set version from tag
        shell: bash
        run: |
          TARGET="${GITHUB_REF_NAME#v}"
          CURRENT=$(node -p "require('./package.json').version")
          if [ "$CURRENT" != "$TARGET" ]; then
            npm version "$TARGET" --no-git-tag-version
          else
            echo "Version already $TARGET, skip bump"
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build:win

      - name: Clean old release
        shell: bash
        run: gh release delete "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --yes || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create release and upload assets
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --title "$VERSION" --notes "" \
            "dist/mission-app-${VERSION}-setup.exe" \
            "dist/mission-app-${VERSION}-setup.exe.blockmap" \
            "dist/latest.yml"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
